<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 Lecture & Timestamp Tracker</title>
    <link rel="manifest" href="manifest.json">
    <!-- Mobile Native App Settings -->
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- App Logo Icon for Home Screen & Browser Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <!-- Tailwind CSS & Confetti Animation -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    
    <!-- Custom Startup Splash Screen -->
    <div id="splashScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-xl shadow-indigo-500/30 animate-bounce mb-4 text-3xl">
            📚
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Class 12 Tracker</h1>
        <p class="text-xs text-slate-500 mt-1">Loading your progress...</p>
    </div>

    <div class="max-w-2xl mx-auto px-4 py-6">
        <!-- App Header -->
        <header class="mb-6 flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                    📚
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Class 12 Tracker</h1>
                    <p class="text-xs text-slate-400">Never lose your timestamp again</p>
                </div>
            </div>
        </header>

        <!-- Stats Counter -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-center">
                <span class="text-xs text-slate-400 font-medium">Total</span>
                <p id="statTotal" class="text-lg font-bold text-slate-200">0</p>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-center">
                <span class="text-xs text-amber-400 font-medium">In Progress</span>
                <p id="statProgress" class="text-lg font-bold text-amber-400">0</p>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-center">
                <span class="text-xs text-emerald-400 font-medium">Completed</span>
                <p id="statCompleted" class="text-lg font-bold text-emerald-400">0</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                <span>➕ Add / Update Lecture Spot</span>
            </h2>
            <form id="lectureForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Subject</label>
                        <input type="text" id="subject" placeholder="e.g., Physics, Math, Chemistry" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Lecture Name / Topic</label>
                        <input type="text" id="lectureName" placeholder="e.g., Electrostatics Lec 03" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Last Timestamp (Stopped at)</label>
                        <input type="text" id="timestamp" placeholder="e.g., 42:15 or 1h 10m" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Status</label>
                        <select id="status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20 text-sm">Save Progress</button>
            </form>
        </div>

        <!-- Lecture Progress List -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">My Saved Progress</h2>
            <div id="lectureList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Smooth Splash Screen Removal
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => splash.remove(), 500);
                }
            }, 600);
        });

        const form = document.getElementById('lectureForm');
        const subjectInput = document.getElementById('subject');
        const lectureNameInput = document.getElementById('lectureName');
        const timestampInput = document.getElementById('timestamp');
        const statusInput = document.getElementById('status');
        const lectureList = document.getElementById('lectureList');

        let lectures = JSON.parse(localStorage.getItem('class12_lectures_v2')) || [];

        function saveAndRender() {
            localStorage.setItem('class12_lectures_v2', JSON.stringify(lectures));
            renderLectures();
            updateStats();
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = lectures.length;
            document.getElementById('statProgress').innerText = lectures.filter(l => l.status === 'In Progress').length;
            document.getElementById('statCompleted').innerText = lectures.filter(l => l.status === 'Completed').length;
        }

        function renderLectures() {
            lectureList.innerHTML = '';
            if (lectures.length === 0) {
                lectureList.innerHTML = '<p class="text-slate-600 text-center py-8 text-sm">No lecture progress recorded yet.</p>';
                return;
            }

            lectures.forEach((lec, index) => {
                const isDone = lec.status === 'Completed';
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition-all ${isDone ? 'bg-slate-900/30 border-slate-800/50 opacity-60' : 'bg-slate-900 border-slate-800'}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] font-bold tracking-wider uppercase text-indigo-400 block mb-0.5">${lec.subject}</span>
                            <h3 class="font-medium text-slate-200 text-sm ${isDone ? 'line-through' : ''}">${lec.name}</h3>
                        </div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${isDone ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                            ${lec.status}
                        </span>
                    </div>

                    <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs text-slate-400">Stopped at:</span>
                            <span class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/60 px-2 py-0.5 rounded font-mono font-bold text-xs">⏱️ ${lec.timestamp}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="updateTimestamp(${index})" class="text-xs text-indigo-400 hover:text-indigo-300">Edit Time</button>
                            <button onclick="deleteLecture(${index})" class="text-xs text-red-400 hover:text-red-300">Delete</button>
                        </div>
                    </div>
                `;
                lectureList.appendChild(card);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const sub = subjectInput.value.trim();
            const name = lectureNameInput.value.trim();
            const ts = timestampInput.value.trim();
            const st = statusInput.value;

            const existingIndex = lectures.findIndex(
                l => l.subject.toLowerCase() === sub.toLowerCase() && l.name.toLowerCase() === name.toLowerCase()
            );

            if (existingIndex !== -1) {
                lectures[existingIndex].timestamp = ts;
                lectures[existingIndex].status = st;
            } else {
                lectures.push({ subject: sub, name: name, timestamp: ts, status: st });
            }

            if (st === 'Completed' && typeof confetti === 'function') {
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            }

            subjectInput.value = '';
            lectureNameInput.value = '';
            timestampInput.value = '';
            saveAndRender();
        });

        window.updateTimestamp = function(index) {
            const newTime = prompt("Enter updated timestamp (e.g., 55:20):", lectures[index].timestamp);
            if (newTime !== null && newTime.trim() !== "") {
                lectures[index].timestamp = newTime.trim();
                saveAndRender();
            }
        };

        window.deleteLecture = function(index) {
            if (confirm("Delete this lecture entry?")) {
                lectures.splice(index, 1);
                saveAndRender();
            }
        };

        saveAndRender();
    </script>
</body>
</html>
