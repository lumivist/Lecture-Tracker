<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 Lecture & Timestamp Tracker</title>
    
    <!-- PWA & Mobile Native App Settings -->
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <!-- Custom Graduation Cap App Logo & Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2'%3E%3Cpath d='M22 10v6M2 10l10-5 10 5-10 5z'/%3E%3Cpath d='M6 12v5c0 2 3 3 6 3s6-1 6-3v-5'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2'%3E%3Cpath d='M22 10v6M2 10l10-5 10 5-10 5z'/%3E%3Cpath d='M6 12v5c0 2 3 3 6 3s6-1 6-3v-5'/%3E%3C/svg%3E">

    <!-- Tailwind CSS & Confetti -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased selection:bg-cyan-500 selection:text-white">
    
    <!-- Startup Splash Screen with Graduation Logo -->
    <div id="splashScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-600 to-teal-400 p-0.5 shadow-2xl shadow-cyan-500/30 animate-bounce mb-4">
            <div class="w-full h-full bg-slate-900 rounded-2xl flex items-center justify-center">
                <svg class="w-10 h-10 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>
                </svg>
            </div>
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-300 bg-clip-text text-transparent">Class 12 Tracker</h1>
        <p class="text-xs text-slate-500 mt-1">Loading your study progress...</p>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="mb-6 flex items-center justify-between border-b border-slate-800/80 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-blue-600 to-teal-400 p-0.5 shadow-lg shadow-cyan-500/20">
                    <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center">
                        <svg class="w-6 h-6 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-300 bg-clip-text text-transparent">Class 12 Tracker</h1>
                    <p class="text-xs text-slate-400">Never lose your timestamp again</p>
                </div>
            </div>
        </header>

        <!-- 4-Card Stats Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Tracked</span>
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>
                </div>
                <p id="statTotal" class="text-2xl font-black text-slate-100">0 <span class="text-xs font-normal text-slate-400">Lectures</span></p>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">In Progress</span>
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <p id="statProgress" class="text-2xl font-black text-amber-400">0 <span class="text-xs font-normal text-slate-400">Active</span></p>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Completed</span>
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <p id="statCompleted" class="text-2xl font-black text-emerald-400">0 <span class="text-xs font-normal text-slate-400">Finished</span></p>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Completion Rate</span>
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </div>
                <p id="statRate" class="text-2xl font-black text-cyan-400 mb-2">0%</p>
                <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden border border-slate-800">
                    <div id="rateBar" class="bg-gradient-to-r from-cyan-500 to-teal-400 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Add Entry Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-8 shadow-xl">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                <span>➕ Add / Update Lecture Spot</span>
            </h2>
            <form id="lectureForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Subject</label>
                        <input type="text" id="subject" placeholder="e.g., Physics, Math, Chemistry" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Lecture Name / Topic</label>
                        <input type="text" id="lectureName" placeholder="e.g., Electrostatics Lec 03" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Last Timestamp (Stopped at)</label>
                        <input type="text" id="timestamp" placeholder="e.g., 42:15 or 1h 10m" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Status</label>
                        <select id="status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-500 hover:to-teal-400 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-lg shadow-cyan-500/20 text-sm">Save Lecture Progress</button>
            </form>
        </div>

        <!-- Toolbar Section (Search, Filter, Backup Buttons) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="searchInput" placeholder="Search chapter or subject..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Subject:</span>
                    <select id="filterSubject" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="All">All Subjects</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Sort:</span>
                    <select id="sortOrder" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="recent">Recent</option>
                        <option value="alpha">Alphabetical</option>
                    </select>
                </div>

                <!-- Export Backup Button -->
                <button onclick="exportData()" title="Export Backup" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 rounded-xl transition">
                    📥
                </button>
                <!-- Import Backup Button -->
                <label title="Import Backup" class="p-2.5 bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 rounded-xl cursor-pointer transition">
                    📤 <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- Lecture Progress List -->
        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>
                Subject Progress & Lectures
            </h2>
            <div id="lectureList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Smooth Splash Screen Removal
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => splash.remove(), 500);
                }
            }, 600);
        });

        const form = document.getElementById('lectureForm');
        const subjectInput = document.getElementById('subject');
        const lectureNameInput = document.getElementById('lectureName');
        const timestampInput = document.getElementById('timestamp');
        const statusInput = document.getElementById('status');
        const lectureList = document.getElementById('lectureList');
        const searchInput = document.getElementById('searchInput');
        const filterSubject = document.getElementById('filterSubject');
        const sortOrder = document.getElementById('sortOrder');

        let lectures = JSON.parse(localStorage.getItem('class12_lectures_v3')) || [];

        function saveAndRender() {
            localStorage.setItem('class12_lectures_v3', JSON.stringify(lectures));
            updateFilters();
            renderLectures();
            updateStats();
        }

        function updateStats() {
            const total = lectures.length;
            const progress = lectures.filter(l => l.status === 'In Progress').length;
            const completed = lectures.filter(l => l.status === 'Completed').length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('statTotal').innerHTML = `${total} <span class="text-xs font-normal text-slate-400">Lectures</span>`;
            document.getElementById('statProgress').innerHTML = `${progress} <span class="text-xs font-normal text-slate-400">Active</span>`;
            document.getElementById('statCompleted').innerHTML = `${completed} <span class="text-xs font-normal text-slate-400">Finished</span>`;
            document.getElementById('statRate').innerText = `${rate}%`;
            document.getElementById('rateBar').style.width = `${rate}%`;
        }

        function updateFilters() {
            const subjects = [...new Set(lectures.map(l => l.subject))];
            const currentSub = filterSubject.value;
            filterSubject.innerHTML = '<option value="All">All Subjects</option>';
            subjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.innerText = sub;
                if (sub === currentSub) opt.selected = true;
                filterSubject.appendChild(opt);
            });
        }

        function renderLectures() {
            lectureList.innerHTML = '';
            let filtered = lectures.filter(lec => {
                const matchesSearch = lec.subject.toLowerCase().includes(searchInput.value.toLowerCase()) || 
                                      lec.name.toLowerCase().includes(searchInput.value.toLowerCase());
                const matchesSub = filterSubject.value === 'All' || lec.subject === filterSubject.value;
                return matchesSearch && matchesSub;
            });

            if (sortOrder.value === 'alpha') {
                filtered.sort((a, b) => a.subject.localeCompare(b.subject));
            }

            if (filtered.length === 0) {
                lectureList.innerHTML = '<p class="text-slate-600 text-center py-8 text-sm">No lecture progress found.</p>';
                return;
            }

            filtered.forEach((lec, index) => {
                const originalIndex = lectures.findIndex(l => l === lec);
                const isDone = lec.status === 'Completed';
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition-all ${isDone ? 'bg-slate-900/30 border-slate-800/50 opacity-60' : 'bg-slate-900 border-slate-800'}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] font-bold tracking-wider uppercase text-cyan-400 block mb-0.5">${lec.subject}</span>
                            <h3 class="font-medium text-slate-200 text-sm ${isDone ? 'line-through' : ''}">${lec.name}</h3>
                        </div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${isDone ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                            ${lec.status}
                        </span>
                    </div>

                    <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs text-slate-400">Stopped at:</span>
                            <span class="bg-cyan-950/80 text-cyan-300 border border-cyan-800/60 px-2 py-0.5 rounded font-mono font-bold text-xs">⏱️ ${lec.timestamp}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="updateTimestamp(${originalIndex})" class="text-xs text-cyan-400 hover:text-cyan-300">Edit Time</button>
                            <button onclick="deleteLecture(${originalIndex})" class="text-xs text-red-400 hover:text-red-300">Delete</button>
                        </div>
                    </div>
                `;
                lectureList.appendChild(card);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const sub = subjectInput.value.trim();
            const name = lectureNameInput.value.trim();
            const ts = timestampInput.value.trim();
            const st = statusInput.value;

            const existingIndex = lectures.findIndex(
                l => l.subject.toLowerCase() === sub.toLowerCase() && l.name.toLowerCase() === name.toLowerCase()
            );

            if (existingIndex !== -1) {
                lectures[existingIndex].timestamp = ts;
                lectures[existingIndex].status = st;
            } else {
                lectures.push({ subject: sub, name: name, timestamp: ts, status: st });
            }

            if (st === 'Completed' && typeof confetti === 'function') {
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
            }

            subjectInput.value = '';
            lectureNameInput.value = '';
            timestampInput.value = '';
            saveAndRender();
        });

        window.updateTimestamp = function(index) {
            const newTime = prompt("Enter updated timestamp (e.g., 55:20):", lectures[index].timestamp);
            if (newTime !== null && newTime.trim() !== "") {
                lectures[index].timestamp = newTime.trim();
                saveAndRender();
            }
        };

        window.deleteLecture = function(index) {
            if (confirm("Delete this lecture entry?")) {
                lectures.splice(index, 1);
                saveAndRender();
            }
        };

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lectures));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "class12_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        };

        window.importData = function(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        lectures = JSON.parse(e.target.result);
                        saveAndRender();
                        alert("Backup restored successfully!");
                    } catch (err) {
                        alert("Invalid backup file format.");
                    }
                };
            }
        };

        searchInput.addEventListener('input', renderLectures);
        filterSubject.addEventListener('change', renderLectures);
        sortOrder.addEventListener('change', renderLectures);

        saveAndRender();
    </script>
</body>
</html>
